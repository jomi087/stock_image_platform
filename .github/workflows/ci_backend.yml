name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'sip_backend/**'
  pull_request:
    paths:
      - 'sip_backend/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sip_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Build Docker image
        run: docker build -t sip-backend .